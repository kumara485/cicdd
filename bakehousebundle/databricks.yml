# This is a Declarative Automation Bundle definition for bakehousebundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehousebundle
  uuid: be3f842b-90d4-4878-9f40-aff3a89e8196

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-edc55625-7b4f.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-edc55625-7b4f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/kumar485hyd@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kumar485hyd@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: kumar485hyd@gmail.com
        level: CAN_MANAGE
